<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>.ttl{font-size:16px;font-weight:600;fill:#1f2328}.note{font-size:12px;fill:#57606a}.ax{stroke:#8b949e;stroke-width:1.2}.grid{stroke:#e4e8ec;stroke-width:1}.old{fill:#bc4c00}.new{fill:#1a7f37}.chk{fill:#0f5fa6}.lbl{font-size:13px;fill:#1f2328}</style>
<text x="20" y="28" class="ttl">Время публикации сайта: старая и новая схема</text>
<text x="20" y="48" class="note">Среднее по 3 (старая) и 5 (новая) запускам workflow, job публикации, секунды.</text>
<text x="20" y="66" class="note">Это время публикации документации, а не метрики стенда: замеры взяты из API GitHub.</text>
<line x1="90" y1="320.0" x2="680" y2="320.0" class="grid"/>
<text x="80" y="324.0" class="note" text-anchor="end">0</text>
<line x1="90" y1="282.7" x2="680" y2="282.7" class="grid"/>
<text x="80" y="286.7" class="note" text-anchor="end">15</text>
<line x1="90" y1="245.3" x2="680" y2="245.3" class="grid"/>
<text x="80" y="249.3" class="note" text-anchor="end">30</text>
<line x1="90" y1="208.0" x2="680" y2="208.0" class="grid"/>
<text x="80" y="212.0" class="note" text-anchor="end">45</text>
<line x1="90" y1="170.7" x2="680" y2="170.7" class="grid"/>
<text x="80" y="174.7" class="note" text-anchor="end">60</text>
<line x1="90" y1="133.3" x2="680" y2="133.3" class="grid"/>
<text x="80" y="137.3" class="note" text-anchor="end">75</text>
<line x1="90" y1="96.0" x2="680" y2="96.0" class="grid"/>
<text x="80" y="100.0" class="note" text-anchor="end">90</text>
<line x1="90" y1="96" x2="90" y2="320" class="ax"/>
<line x1="90" y1="320" x2="680" y2="320" class="ax"/>
<text x="18" y="160" class="note" text-anchor="middle" transform="rotate(-90 18 160)">секунды</text>
<rect x="118" y="140.8" width="58" height="179.2" class="old"/>
<text x="147.0" y="132.8" class="lbl" text-anchor="middle" font-weight="600">72</text>
<text x="147.0" y="340" class="lbl" text-anchor="middle">Helios, старая</text>
<rect x="196" y="250.3" width="58" height="69.7" class="new"/>
<text x="225.0" y="242.3" class="lbl" text-anchor="middle" font-weight="600">28</text>
<text x="225.0" y="340" class="lbl" text-anchor="middle">Helios, новая</text>
<line x1="304" y1="82" x2="304" y2="320" stroke="#d0d7de" stroke-dasharray="4 4"/>
<text x="316" y="94" class="note">GitHub Pages</text>
<text x="118" y="94" class="note">Helios</text>
<rect x="316" y="289.4" width="58" height="30.6" class="old"/>
<text x="345.0" y="281.4" class="lbl" text-anchor="middle" font-weight="600">12.3</text>
<text x="345.0" y="340" class="lbl" text-anchor="middle">Pages, старая</text>
<rect x="394" y="291.6" width="58" height="28.4" class="new"/>
<text x="423.0" y="283.6" class="lbl" text-anchor="middle" font-weight="600">11.4</text>
<text x="423.0" y="340" class="lbl" text-anchor="middle">Pages, новая</text>
<rect x="472" y="283.2" width="58" height="36.8" class="chk"/>
<text x="501.0" y="275.2" class="lbl" text-anchor="middle" font-weight="600">14.8</text>
<text x="501.0" y="340" class="lbl" text-anchor="middle">Pages, новая с проверкой</text>
<text x="20" y="396" class="note">Helios: публикация стала в 2.57 раза быстрее — rsync переносит только изменившиеся файлы.</text>
<text x="20" y="414" class="note">Pages: публикация почти не изменилась, но к ней добавилась проверка опубликованного сайта (синяя колонка).</text>
</svg>