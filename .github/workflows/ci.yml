# Независимая проверка стенда (раздел 4 отчёта ПР-3).
#   check  — typecheck, модульные тесты статистики, эхо-тесты WT и RTC;
#   smoke  — сборка образа и дымовой план на топологии с маршрутизатором
#            (make verify-smoke): калибровка netem, A/A и знак H2;
#   image  — по тегу v*: публикация образа в GHCR, digest — в сводке запуска.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck и тесты
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: node scripts/test-stats.mjs
      - name: Эхо-тесты WebRTC и WebTransport
        run: |
          yarn start > server.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:8080/api/info >/dev/null && break; sleep 1; done
          yarn test
      - if: failure()
        run: cat server.log

  smoke:
    name: Дымовой прогон стенда
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: make image
      - run: make verify-smoke HOST_LABEL="github-actions ubuntu-24.04"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: results/smoke/

  image:
    name: Публикация образа
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Сборка и публикация
        run: |
          ref="ghcr.io/${GITHUB_REPOSITORY,,}/rtc-bench-exp:${GITHUB_REF_NAME}"
          docker build -f experiment/Dockerfile -t "$ref" .
          docker push "$ref"
          digest="$(docker image inspect "$ref" --format '{{index .RepoDigests 0}}')"
          echo "Образ: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
