name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      healthcheck_marker:
        description: 'Контрольная строка healthcheck вместо штатной id="rtc-benchmark" (проверка срабатывания)'
        required: false
        default: ''
        type: string

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PAGES_HEALTHCHECK_MARKER: ${{ inputs.healthcheck_marker || 'id="rtc-benchmark"' }}
  PAGES_HEALTHCHECK_ATTEMPTS: '10'
  PAGES_HEALTHCHECK_DELAY_SEC: '10'

jobs:
  build:
    name: Сборка сайта
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v7

      - name: Установить Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Собрать сайт в строгом режиме
        run: python -m mkdocs build --strict

      - name: Сохранить артефакт сборки
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Публикация
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v6

      - name: Опубликовать в GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify:
    name: Проверка публикации
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Проверить опубликованный сайт
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -uo pipefail

          url="${PAGES_URL%/}/"
          if [ -z "${PAGES_URL:-}" ]; then
            echo "::error::Job deploy не отдала адрес публикации — проверять нечего."
            exit 1
          fi

          echo "Healthcheck: $url"
          ok=0
          for attempt in $(seq 1 "$PAGES_HEALTHCHECK_ATTEMPTS"); do
            echo "Попытка $attempt/$PAGES_HEALTHCHECK_ATTEMPTS: $url"
            body_file="$(mktemp)"
            search_file="$(mktemp)"
            # Обнуление файлов ответа: при сетевой ошибке curl их не создаёт,
            # и grep на прошлом содержимом дал бы ложное «страница нашлась».
            # curl сам вернёт код 000 при сетевой ошибке, поэтому set -e здесь
            # не нужен, но код всё равно разбираем явно.
            code="$(curl -sS -L --max-time 30 -o "$body_file" -w '%{http_code}' \
              "$url" || true)"
            search_code="$(curl -sS -L --max-time 30 -o "$search_file" -w '%{http_code}' \
              "${url}search/search_index.json" || true)"
            if [ "$code" = 200 ] \
              && grep --quiet --fixed-strings "$PAGES_HEALTHCHECK_MARKER" "$body_file" \
              && [ "$search_code" = 200 ]; then
              echo "OK: HTTP 200, контрольная строка найдена, поисковый индекс отдаётся."
              echo "- URL: $url"
              echo "- Контрольная строка: \`$PAGES_HEALTHCHECK_MARKER\`"
              # ${GITHUB_SHA:-} а не ${GITHUB_SHA}: под set -u скрипт падает
              # и на этом сообщении, если переменной нет — в самом workflow она
              # есть всегда, а вот при локальной проверке шага нет.
              echo "- Коммит workflow: ${GITHUB_SHA:-неизвестен}"
              ok=1
              rm -f "$body_file" "$search_file"
              break
            fi
            echo "  код=$code, размер=$(wc -c < "$body_file" | tr -d ' ') байт; поиск: код=$search_code"
            rm -f "$body_file" "$search_file"
            [ "$attempt" -lt "$PAGES_HEALTHCHECK_ATTEMPTS" ] \
              && sleep "$PAGES_HEALTHCHECK_DELAY_SEC"
          done
          if [ "$ok" -eq 0 ]; then
            # Возвращать нечего: предыдущая публикация на Pages недоступна для
            # отката, у Pages нет релизов. Поэтому job просто падает — красный
            # статус и будет сигналом, что публиковать было нельзя.
            echo "::error::Публикация на GitHub Pages не подтверждена: $url"
            exit 1
          fi
