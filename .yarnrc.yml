# Нативный QUIC-транспорт @fails-components/webtransport подгружается динамически
# (require) и не объявлен в dependencies самой библиотеки. Под PnP такой доступ
# запрещён, поэтому объявляем его через packageExtensions.
packageExtensions:
  "@fails-components/webtransport@*":
    dependencies:
      "@fails-components/webtransport-transport-http3-quiche": "1.6.8"
